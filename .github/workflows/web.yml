name: GameVault web (rebuild)

on:
  push:
    branches: ["main"]
    paths: ["web/**", "core.js", "shared/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "core.js", "shared/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Includes the merge-parity tests against the classic site's core.js.
      - run: npm test
      - run: npm run build
