name: Android TV native

on:
  push:
    branches: ["main"]
    paths:
      - "android-tv-native/**"
      - "shared/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android-tv-native/**"
      - "shared/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Make Gradle wrapper executable
        working-directory: android-tv-native
        run: chmod +x gradlew
      - name: Build native Android TV APK
        working-directory: android-tv-native
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-native-tv-debug
          path: android-tv-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
