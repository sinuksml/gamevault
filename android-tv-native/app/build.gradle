plugins {
    id "com.android.application"
}

android {
    namespace "in.sinu.gamevault.nativetv"
    compileSdk 35

    defaultConfig {
        applicationId "in.sinu.gamevault.nativetv"
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName "3.0.3-native-tv"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Plain-JVM tests. A device supplies org.json itself; a unit test does not.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
