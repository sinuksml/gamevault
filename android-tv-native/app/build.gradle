plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "in.sinu.gamevault.nativetv"
    compileSdk 37

    defaultConfig {
        applicationId "in.sinu.gamevault.nativetv"
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName "3.2.0-native-tv"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.09.00")
    implementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.tv:tv-material:1.1.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "io.coil-kt.coil3:coil-compose:3.6.3"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.6.3"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Plain-JVM tests. A device supplies org.json itself; a unit test does not.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
